# ==================== CONDITIONAL BEAN CONFIGURATION ====================
#
# Q: Yeh property kaise kaam karti hai?
# A: @ConditionalOnProperty annotation check karta hai yeh value
#    notify.type=email ? EmailNotificationService activate hoga
#    notify.type=sms ? SmsNotificationService activate hoga
#
# Q: Value change karke test kaise kare?
# A: 1. notify.type=sms set karo
#    2. Application restart karo
#    3. Output check karo - SMS service active ho jayega!
#
# Q: Agar yeh property comment kar de?
# A: Koi bhi conditional bean activate nahi hoga
#    Application error dega: No qualifying bean found
#
# ===========================================================================

notify.type=sms

# SMS service is now ACTIVE! ?
# To switch back to email, change to: notify.type=email
# Current output will be: "SMS: ..." instead of "Email: ..."

